  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

;width:0;height:1px;background:currentColor;transition:width .25s ease;}\n  .site-nav a:hover::after{width:100%;}\n  .phones-inner{animation:phonesFloat 6s ease-in-out infinite;}\n  @keyframes phonesFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}\n  @keyframes dinSpotPulse{0%,100%{box-shadow:0 0 0 0 rgba(0,200,100,.4);}60%{box-shadow:0 0 0 5px rgba(0,200,100,0);}}\n  #dinHeroSpots:hover{background:var(--newsprint);border-color:var(--graphite);}\n\n  #dinLoader{position:fixed;inset:0;z-index:99999;background:var(--void);display:flex;align-items:center;justify-content:center;transition:transform 1.1s cubic-bezier(.76,0,.24,1);}\n  #dinLoader.reveal{transform:translateY(-100%);}\n  #dinLoader .din-mark{width:64px;height:64px;border-radius:14px;opacity:0;transform:scale(.8);animation:dinMarkIn 1s cubic-bezier(.16,1,.3,1) .15s forwards;}\n  #dinLoader .din-word{margin-top:18px;font-weight:800;font-size:15px;letter-spacing:.18em;text-transform:uppercase;color:var(--bone);opacity:0;transform:translateY(8px);animation:dinWordIn .8s ease .55s forwards;}\n  @keyframes dinMarkIn{0%{opacity:0;transform:scale(.8);filter:blur(6px);}100%{opacity:1;transform:scale(1);filter:blur(0);}}\n  @keyframes dinWordIn{to{opacity:1;transform:translateY(0);}}\n  body.din-loading{overflow:hidden;}\n  #dinPage{opacity:0;transform:translateY(14px) scale(.99);transition:opacity 1s cubic-bezier(.22,1,.36,1) .3s,transform 1.1s cubic-bezier(.22,1,.36,1) .3s;}\n  #dinPage.din-in{opacity:1;transform:none;}\n\n  .hero-grid{display:grid;grid-template-columns:1fr 400px;gap:24px;align-items:center;}\n  .site-nav{display:flex;gap:32px;font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink);}\n  .phones-outer{position:relative;width:100%;max-width:400px;min-height:600px;overflow:visible;margin:0 auto;}\n  .cols-2{display:grid;grid-template-columns:1fr 1fr;gap:48px;}\n\n  @media (max-width:1180px){\n    .wrap{padding:0 32px}\n  }\n  @media (max-width:980px){\n    .site-nav{display:none}\n    .hero-grid{grid-template-columns:1fr}\n    .phones-outer{margin:40px auto 0;}\n  }\n  @media (max-width:800px){\n    .cols-2{grid-template-columns:1fr}\n    .cols-3{grid-template-columns:1fr}\n  }\n  @media (max-width:640px){\n    .wrap{padding:0 20px}\n    .phones-outer{max-width:280px;height:340px;}\n    .footer-badges{justify-content:center}\n  }\n\n  /* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n     MOBILE RESPONSIVE \u2014 all breakpoints\n     \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */\n\n  /* \u2500\u2500 Secondary overflow guard \u2500\u2500 */\n  #dinPage{overflow-x:hidden;}\n\n  /* \u2500\u2500 Tablet \u2264768px \u2500\u2500 */\n  @media (max-width:768px){\n    /* Hero: use individual padding properties to preserve horizontal spacing.\n       The section is also .wrap, so sides must match .wrap's 32px at this range. */\n    section.hero-grid{\n      padding-top:36px !important;\n      padding-right:32px !important;\n      padding-bottom:64px !important;\n      padding-left:32px !important;\n    }\n    /* Section vertical padding */\n    #how{padding:24px 0 64px !important;overflow:hidden;}\n    #pricing,#privacy{padding:64px 0 !important;}\n    #join-beta{padding:64px 0 !important;}\n    .why-50{padding:64px 0 !important;}\n    /* Carousel caption: allow text to wrap */\n    #howCaption h3{white-space:normal !important;}\n    #howCaption p{white-space:normal !important;}\n    /* Footer: stack items centered */\n    footer .wrap>div:first-child{flex-direction:column;align-items:center;text-align:center;}\n    footer nav{justify-content:center;}\n  }\n\n  /* \u2500\u2500 Form stack \u2264560px (before .wrap hits 20px) \u2500\u2500 */\n  @media (max-width:560px){\n    #dinBetaForm{flex-direction:column;align-items:stretch;}\n    #dinBetaEmail{min-width:0 !important;width:100%;}\n    #dinBetaForm button[type=\"submit\"]{width:100%;}\n  }\n\n  /* \u2500\u2500 Mobile \u2264640px \u2500\u2500 */\n  @media (max-width:640px){\n    /* Hero: sides drop to 20px to match .wrap at this breakpoint */\n    section.hero-grid{padding-right:20px !important;padding-left:20px !important;}\n    /* Hero badge: prevent overflow by allowing wrapping */\n    section.hero-grid>div>div:first-child{max-width:100%;align-items:flex-start;}\n    #heroBadge{padding:5px 12px 5px 5px;gap:7px;margin-bottom:20px;}\n    #heroBadge span{font-size:12px;font-weight:500;line-height:1.35;}\n    #heroBadge>div>div{width:20px !important;height:20px !important;font-size:10px !important;margin-right:-6px !important;}\n    /* Carousel nav buttons: pull inward from edge */\n    #howPrev{left:4px !important;}\n    #howNext{right:4px !important;}\n  }\n\n  /* \u2500\u2500 Small mobile \u2264480px \u2500\u2500 */\n  @media (max-width:480px){\n    /* Hero vertical padding */\n    section.hero-grid{padding-top:28px !important;padding-bottom:48px !important;}\n    /* Hero h1: reduce minimum from 48px to 28px so it fits narrow viewports */\n    section.hero-grid h1{font-size:clamp(28px,8.5vw,80px) !important;}\n    /* Section vertical padding */\n    #how{padding:16px 0 48px !important;}\n    #pricing,#privacy{padding:48px 0 !important;}\n    #join-beta{padding:48px 0 !important;}\n    .why-50{padding:48px 0 !important;}\n    /* Carousel */\n    #howCarousel{height:420px !important;}\n    #howCaption h3{font-size:20px !important;}\n    /* Beta modal */\n    #dinBetaModal>div{padding:28px 24px !important;}\n    #dinSpotsWrap{justify-content:center;text-align:center;}\n  }\n\n<\/style>\n<link rel=\"icon\" type=\"image/png\" href=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAIwAAACMCAYAAACu       <div class=\"how-dot\" data-i=\"0\" style=\"width:8px;height:8px;border-radius:50%;cursor:pointer;transition:background .25s ease,transform .25s ease;\"><\/div>\n        <div class=\"how-dot\" data-i=\"1\" style=\"width:8px;height:8px;border-radius:50%;cursor:pointer;transition:background .25s ease,transform .25s ease;\"><\/div>\n        <div class=\"how-dot\" data-i=\"2\" style=\"width:8px;height:8px;border-radius:50%;cursor:pointer;transition:background .25s ease,transform .25s ease;\"><\/div>\n      <\/div>\n    <\/div>\n    <script>\n    (function(){\n      var prev = document.getElementById('howPrev');\n      var next = document.getElementById('howNext');\n      var track = document.getElementById('howCarousel');\n      var dots = document.querySelectorAll('.how-dot');\n      var slides = document.querySelectorAll('.how-slide');\n      var caption = document.getElementById('howCaption');\n      var videos = document.querySelectorAll('.how-video');\n      var steps = [\n        { label: 'Step 1', title: 'Choose distracting app', body: 'Pick the apps you reach for on autopilot.' },\n        { label: 'Step 2', title: 'Choose habit window', body: 'Do It Now steps in before the app does.' },\n        { label: 'Step 3', title: 'Open distracting app', body: 'Repeat &#39;DO IT NOW&#39; to unlock access.' }\n      ];\n      var idx = 0;\n      function render(){\n        slides.forEach(function(s, i){\n          var offset = i - idx;\n          var t, scale, opacity, z;\n          if (offset === 0) { t = '-50%'; scale = 1; opacity = 1; z = 3; }\n          else if (offset === -1 || offset === slides.length - 1) { t = '-130%'; scale = .78; opacity = .45; z = 2; }\n          else if (offset === 1 || offset === -(slides.length - 1)) { t = '30%'; scale = .78; opacity = .45; z = 2; }\n          else { t = '-50%'; scale = .6; opacity = 0; z = 1; }\n          s.style.transform = 'translateX(' + t + ') scale(' + scale + ')';\n          s.style.opacity = opacity;\n          s.style.zIndex = z;\n        });\n        dots.forEach(function(d, i){ d.style.background = i === idx ? 'var(--ink)' : 'var(--border-light)'; });\n        videos.forEach(function(v, i){\n          if (i === idx) { v.currentTime = 0; v.play().catch(function(){}); }\n          else { v.pause(); }\n        });\n        caption.style.opacity = '0';\n        window.setTimeout(function(){\n          var step = steps[idx];\n          caption.innerHTML =\n            '<div style=\"font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--signal);white-space:nowrap;\">' + step.label + '<\/div>' +\n            '<h3 style=\"font-size:26px;font-weight:800;margin:8px 0 0;\">' + step.title + '<\/h3>' +\n            '<p style=\"font-size:14px;line-height:1.5;color:#3a3a37;margin:8px 0 0;\">' + step.body + '<\/p>';\n          caption.style.opacity = '1';\n        }, 180);\n      }\n      function goTo(i){ idx = (i + slides.length) % slides.length; render(); }\n      prev.addEventListener('click', function(){ goTo(idx - 1); });\n      next.addEventListener('click', function(){ goTo(idx + 1); });\n      dots.forEach(function(d){ d.addEventListener('click', function(){ goTo(parseInt(d.getAttribute('data-i'), 10)); }); });\n      var startX = null;\n      track.addEventListener('pointerdown', function(e){ startX = e.clientX; });\n      track.addEventListener('pointerup', function(e){\n        if (startX === null) return;\n        var dx = e.clientX - startX;\n        if (dx > 40) goTo(idx - 1);\n        else if (dx < -40) goTo(idx + 1);\n        startX = null;\n      });\n      render();\n    })();\n    <\/script>\n  <\/div>\n<\/section>\n\n\n<section class=\"why-50\" style=\"background:var(--newsprint);padding:96px 0;border-top:1px solid var(--border-light);\">\n  <div class=\"wrap cols-2 reveal\" style=\"align-items:start;\">\n    <div>\n      <div style=\"font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--pewter);margin-bottom:20px;\">Why 50 times<\/div>\n      <h2 style=\"font-size:32px;font-weight:800;letter-spacing:-.02em;margin:0;text-wrap:balance;\">Why repeat \"Do It Now\" 50 times?<\/h2>\n    <\/div>\n    <div style=\"display:flex;flex-direction:column;gap:20px;\">\n      <div>\n        <p style=\"font-size:14px;line-height:1.6;color:#3a3a37;margin:0;\">Most of us don't lack good intentions. We lack the tiny moment between having the intention and acting on it.<\/p>\n      <\/div>\n      <div>\n        <p style=\"font-size:14px;line-height:1.6;color:#3a3a37;margin:0;\">Repeating \"Do It Now\" fifty times creates just enough friction to interrupt autopilot. Just enough time to remember what you actually meant to do before habit takes over.<\/p>\n      <\/div>\n      <div>\n        <p style=\"font-size:14px;line-height:1.6;color:#3a3a37;margin:0;\">The goal isn't to stop you using your phone. It's to shorten the gap between good intentions and good actions.<\/p>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section id=\"pricing\" style=\"padding:96px 0;\">\n  <div class=\"wrap reveal\">\n    <div style=\"font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--pewter);margin-bottom:20px;\">Pricing<\/div>\n    <h2 style=\"font-size:32px;font-weight:800;letter-spacing:-.02em;margin:0 0 16px;max-width:600px;text-wrap:balance;\">Free during beta. Simple pricing after.<\/h2>\n    <p style=\"font-size:15px;line-height:1.6;color:#3a3a37;margin:0 0 36px;max-width:520px;\">Join now as an early tester and use Do It Now at no cost. Once we launch, it will be:<\/p>\n    <!--\n    <div class=\"cols-3\" style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:24px;\">\n      <div style=\"border:1px solid var(--border-light);border-radius:24px;padding:40px;\">\n        <div style=\"font-weight:800;font-size:15px;text-transform:uppercase;letter-spacing:.02em;\">Monthly<\/div>\n        <div style=\"font-size:36px;font-weight:800;margin-top:16px;\">TBC<span style=\"font-size:14px;color:var(--pewter);font-weight:400;\">/mo<\/span><\/div>\n        <p style=\"font-size:14px;line-height:1.6;color:#3a3a37;margin:20px 0 0;\">Price to be confirmed. Testers keep beta access free for now.<\/p>\n      <\/div>\n      <div style=\"background:var(--void);color:var(--bone);border-radius:24px;padding:40px;\">\n        <div style=\"font-weight:800;font-size:15px;text-transform:uppercase;letter-spacing:.02em;\">Yearly<\/div>\n        <div style=\"font-size:36px;font-weight:800;margin-top:16px;\">TBC<span style=\"font-size:14px;color:var(--pewter);font-weight:400;\">/yr<\/span><\/div>\n        <p style=\"font-size:14px;line-height:1.6;color:#c9c6bd;margin:20px 0 24px;\">Price to be confirmed \u2014 expected to work out cheaper than monthly.<\/p>\n      <\/div>\n    <\/div>\n    -->\n    <div style=\"display:flex;justify-content:center;\">\n      <div style=\"border:1px solid var(--border-light);border-radius:24px;padding:40px;display:flex;flex-direction:column;max-width:400px;width:100%;\">\n        <div style=\"font-weight:800;font-size:15px;text-transform:uppercase;letter-spacing:.02em;\">Beta access \u2014 founding members<\/div>\n        <div style=\"font-size:36px;font-weight:800;margin-top:16px;\">Free<\/div>\n        <p style=\"font-size:14px;line-height:1.6;color:#3a3a37;margin:20px 0 24px;flex:1;\">Register with your email to get early access before public launch.<\/p>\n        <a href=\"#join-beta\" class=\"btn\" style=\"background:var(--void);color:var(--bone);text-align:center;\">Join the beta<\/a>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section id=\"privacy\" style=\"padding:96px 0;border-top:1px solid var(--border-light);\">\n  <div class=\"wrap reveal\">\n    <div style=\"font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--pewter);margin-bottom:20px;\">Privacy<\/div>\n    <div class=\"cols-2\" style=\"align-items:start;\">\n      <div>\n        <h2 style=\"font-size:34px;font-weight:800;letter-spacing:-.02em;margin:0 0 16px;text-wrap:balance;\">Your attention is personal. Your data should be too.<\/h2>\n        <p style=\"font-size:15px;line-height:1.6;color:#3a3a37;margin:0;\">Do It Now only requests the permissions needed to detect your selected apps and deliver the intervention.<\/p>\n      <\/div>\n      <div style=\"display:flex;flex-direction:column;gap:20px;\">\n        <div>\n          <div style=\"font-weight:700;font-size:15px;margin-bottom:6px;\">What the app needs<\/div>\n          <p style=\"font-size:14px;line-height:1.6;color:#3a3a37;margin:0;\">Do It Now uses your selected apps, intervention window and completion status to know when to step in.<\/p>\n        <\/div>\n        <div>\n          <div style=\"font-weight:700;font-size:15px;margin-bottom:6px;\">What it cannot see<\/div>\n          <p style=\"font-size:14px;line-height:1.6;color:#3a3a37;margin:0;\">It cannot read your messages, inspect your feed, record your typing or see what you do inside another app.<\/p>\n        <\/div>\n        <div>\n          <div style=\"font-weight:700;font-size:15px;margin-bottom:6px;\">Your voice stays private<\/div>\n          <p style=\"font-size:14px;line-height:1.6;color:#3a3a37;margin:0;\">Voice processing is used only to count the challenge repetitions. Your microphone audio is never stored.<\/p>\n        <\/div>\n        <a href=\"./privacy-policy.html\" style=\"font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;\">Read the full privacy policy \u2192<\/a>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section id=\"join-beta\" style=\"background:var(--void);color:var(--bone);padding:88px 0;position:relative;\">\n  <div id=\"dinBetaModal\" style=\"display:flex;opacity:0;visibility:hidden;position:absolute;inset:0;background:rgba(9,9,9,.85);backdrop-filter:blur(4px);z-index:10;align-items:center;justify-content:center;padding:24px;transition:opacity .35s ease,visibility .35s ease;\">\n    <div style=\"background:var(--paper);color:var(--ink);border-radius:20px;padding:40px;max-width:380px;width:100%;text-align:center;transform:translateY(16px) scale(.96);transition:transform .35s cubic-bezier(.22,1,.36,1);\">\n      <div style=\"font-size:32px;margin-bottom:12px;\">\u2713<\/div>\n      <div style=\"font-weight:800;font-size:20px;margin-bottom:8px;\">You're on the list<\/div>\n      <p style=\"font-size:14px;color:#3a3a37;margin:0 0 24px;\">We'll email you as soon as beta access opens up.<\/p>\n      <button id=\"dinBetaModalClose\" class=\"btn\" style=\"background:var(--void);color:var(--bone);width:100%;\">Close<\/button>\n    <\/div>\n  <\/div>\n  <div class=\"wrap reveal\" style=\"text-align:center;\">\n    <div style=\"font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--signal);margin-bottom:20px;\">Join the beta<\/div>\n    <h2 style=\"font-size:clamp(30px,4vw,44px);font-weight:800;letter-spacing:-.02em;margin:0 auto 16px;max-width:640px;text-wrap:balance;\">Be one of the first to interrupt autopilot.<\/h2>\n    <p style=\"font-size:16px;line-height:1.6;color:#c9c6bd;margin:0 auto 36px;max-width:460px;\">Test Do It Now on your own habits and help shape an intervention that works in real life.<\/p>\n    <div id=\"dinSpotsWrap\" style=\"display:inline-flex;align-items:center;gap:10px;background:var(--ink);border:1px solid var(--graphite);border-radius:100px;padding:10px 20px;margin-bottom:28px;\">\n      <span style=\"width:8px;height:8px;border-radius:50%;background:var(--signal);flex:none;\"><\/span>\n      <span id=\"dinSpotsText\" style=\"font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--bone);\">Loading spots remaining\u2026<\/span>\n    <\/div>\n    <form id=\"dinBetaForm\" style=\"display:flex;gap:10px;justify-content:center;flex-wrap:wrap;max-width:460px;margin:0 auto;\">\n      <input id=\"dinBetaEmail\" type=\"email\" required=\"\" placeholder=\"you@email.com\" style=\"flex:1;min-width:220px;font-family:var(--font-sans);font-size:14px;padding:16px 20px;border-radius:100px;border:1px solid var(--graphite);background:var(--ink);color:var(--bone);outline:none;\">\n      <button class=\"btn\" type=\"submit\" style=\"background:var(--bone);color:var(--void);\">Join the beta<\/button>\n    <\/form>\n    <p id=\"dinBetaFormError\" style=\"font-size:12px;color:#e08a6b;margin:16px 0 0;display:none;\">Something went wrong \u2014 please try again in a moment.<\/p>\n    <p style=\"font-size:12px;color:var(--pewter);margin:16px 0 0;\">We will email you when your test place is ready. No weekly newsletter.<\/p>\n  <\/div>\n<\/section>\n\n<footer style=\"border-top:1px solid var(--border-light);padding:32px 0;\">\n  <div class=\"wrap\" style=\"display:flex;flex-direction:column;gap:24px;\">\n    <div style=\"display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;\">\n      <div style=\"display:flex;align-items:center;gap:10px;\">\n        <img src=\"65276825-9627-4810-b8c7-df0de51840d8\" alt=\"\" style=\"width:22px;height:22px;border-radius:6px;\">\n        <span style=\"font-weight:800;font-size:13px;text-transform:uppercase;\">Do It Now<\/span>\n      <\/div>\n      <nav style=\"display:flex;gap:24px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;\">\n        <a href=\"./privacy-policy.html\">Privacy Policy<\/a>\n        <a href=\"./terms-of-service.html\">Terms of Service<\/a>\n      <\/nav>\n      <span style=\"font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--pewter);\">Choose action before distraction.<\/span>\n    <\/div>\n    <div class=\"footer-badges\" style=\"display:flex;gap:10px;align-items:center;\">\n      <a href=\"#\"><img src=\"209bc2c0-f039-4789-ae47-5827a3475ac4\" alt=\"Download on the App Store\" style=\"height:40px;display:block;\"><\/a>\n      <a href=\"#\"><img src=\"b9d704b8-a6b8-46f3-8313-87b8eb01e4fa\" alt=\"Get it on Google Play\" style=\"height:40px;display:block;\"><\/a>\n    <\/div>\n\n    <div style=\"text-align:center;padding-top:8px;\">\n      <a href=\"https://www.desejos-studio.xyz/\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"font-size:11px;color:var(--pewter);text-decoration:none;transition:opacity .2s;\" onmouseover=\"this.style.opacity='.6'\" onmouseout=\"this.style.opacity='1'\">Powered by Desejos Studio<\/a>\n    <\/div>\n  <\/div>\n<\/footer>\n\n<script>\n(function(){\n  var loader = document.getElementById('dinLoader');\n  var page = document.getElementById('dinPage');\n  function reveal(){\n    document.body.classList.remove('din-loading');\n    loader.classList.add('reveal');\n    page.classList.add('din-in');\n    setTimeout(function(){ loader.remove(); }, 1200);\n  }\n  window.addEventListener('load', function(){ setTimeout(reveal, 1300); });\n})();\n<\/script>\n\n<script>\n(function(){\n  var counterEl = document.getElementById('dinCounter');\n  var celebrationEl = document.getElementById('dinCelebration');\n  var listeningEl = document.getElementById('dinListening');\n  var n = 47;\n  function bump(){\n    counterEl.classList.remove('bounce');\n    void counterEl.offsetWidth;\n    counterEl.classList.add('bounce');\n  }\n  function tick(){\n    n++;\n    counterEl.textContent = n;\n    bump();\n    if(n === 50){\n      setTimeout(function(){\n        celebrationEl.style.opacity = '1';\n        counterEl.style.opacity = '0';\n        listeningEl.style.opacity = '0';\n      }, 350);\n      setTimeout(function(){\n        celebrationEl.style.opacity = '0';\n        counterEl.style.opacity = '1';\n        listeningEl.style.opacity = '1';\n        n = 47;\n        counterEl.textContent = n;\n      }, 2400);\n      setTimeout(tick, 3300);\n    } else {\n      setTimeout(tick, 900);\n    }\n  }\n  setTimeout(tick, 900);\n})();\n(function(){\n  // --- CONFIG: fill these in once your mailing list + counter endpoint exist ---\n  // SIGNUP_ENDPOINT: a URL that accepts a POST {email} and adds it to your list\n  //   (e.g. a Mailchimp form-submit URL, or a Cloudflare Worker in front of Mailchimp/Airtable).\n  // COUNT_ENDPOINT: a URL that returns JSON like {\"count\": 23} = number of signups so far.\n  //   Leave both blank to keep the form working with a local fallback (no real list yet).\n  var SIGNUP_ENDPOINT = '/api/subscribe';\n  var COUNT_ENDPOINT = '/api/count';\n  var CAP = 50;\n\n  var spotsText = document.getElementById('dinSpotsText');\n  function renderSpots(count){\n    var remaining = Math.max(CAP - count, 0);\n    var text = remaining === 0\n      ? 'Founding member spots are full'\n      : remaining + ' of ' + CAP + ' founding member spots left';\n    spotsText.textContent = text;\n    var heroEl = document.getElementById('dinHeroSpotsText');\n    if(heroEl) heroEl.textContent = text;\n  }\n  function loadCount(){\n    if(!COUNT_ENDPOINT){\n      var local = parseInt(localStorage.getItem('dinLocalSignupCount') || '0', 10);\n      renderSpots(local);\n      return;\n    }\n    fetch(COUNT_ENDPOINT).then(function(r){ return r.json(); }).then(function(data){\n      renderSpots(data.count || 0);\n    }).catch(function(){\n      renderSpots(0);\n    });\n  }\n  loadCount();\n\n  var form = document.getElementById('dinBetaForm');\n  var modal = document.getElementById('dinBetaModal');\n  var closeBtn = document.getElementById('dinBetaModalClose');\n  var errorEl = document.getElementById('dinBetaFormError');\n  var emailInput = document.getElementById('dinBetaEmail');\n\n  function showSuccess(){\n    modal.style.visibility = 'visible';\n    modal.style.opacity = '1';\n    modal.querySelector('div').style.transform = 'translateY(0) scale(1)';\n    form.reset();\n    loadCount();\n  }\n\n  form.addEventListener('submit', function(e){\n    e.preventDefault();\n    errorEl.style.display = 'none';\n    var email = emailInput.value;\n\n    if(!SIGNUP_ENDPOINT){\n      // Local fallback so the form + counter work before an endpoint is wired up.\n      var local = parseInt(localStorage.getItem('dinLocalSignupCount') || '0', 10);\n      localStorage.setItem('dinLocalSignupCount', String(local + 1));\n      showSuccess();\n      return;\n    }\n\n    fetch(SIGNUP_ENDPOINT, {\n      method: 'POST',\n      headers: { 'Content-Type': 'application/json' },\n      body: JSON.stringify({ email: email })\n    }).then(function(res){\n      if(!res.ok) throw new Error('bad response');\n      showSuccess();\n    }).catch(function(){\n      errorEl.style.display = 'block';\n    });\n  });\n  closeBtn.addEventListener('click', function(){\n    modal.style.opacity = '0';\n    modal.querySelector('div').style.transform = 'translateY(16px) scale(.96)';\n    setTimeout(function(){ modal.style.visibility = 'hidden'; }, 350);\n  });\n  modal.addEventListener('click', function(e){\n    if(e.target === modal){\n      modal.style.opacity = '0';\n      modal.querySelector('div').style.transform = 'translateY(16px) scale(.96)';\n      setTimeout(function(){ modal.style.visibility = 'hidden'; }, 350);\n    }\n  });\n})();\n(function(){\n  var revealEls = document.querySelectorAll('.reveal');\n  var io = new IntersectionObserver(function(entries){\n    entries.forEach(function(entry){\n      if(entry.isIntersecting){\n        entry.target.classList.add('is-visible');\n        io.unobserve(entry.target);\n      }\n    });\n  }, {threshold:.15});\n  revealEls.forEach(function(el){ io.observe(el); });\n})();\n\n  // \u2500\u2500 FLOATING NAV \u2500\u2500\n  (function() {\n    var navInner = document.querySelector('.nav-inner');\n    var mobileMenu = document.querySelector('.nav-mobile-menu');\n    var hamburger = document.querySelector('.nav-hamburger');\n    if (!navInner) return;\n    window.addEventListener('scroll', function() {\n      navInner.classList.toggle('scrolled', window.scrollY > 50);\n    }, { passive: true });\n    hamburger.addEventListener('click', function() {\n      var open = hamburger.classList.toggle('open');\n      mobileMenu.classList.toggle('open', open);\n      document.body.style.overflow = open ? 'hidden' : '';\n    });\n    mobileMenu.querySelectorAll('a').forEach(function(link) {\n      link.addEventListener('click', function() {\n        hamburger.classList.remove('open');\n        mobileMenu.classList.remove('open');\n        document.body.style.overflow = '';\n      });\n    });\n  })();\n<\/script>\n<\/div>\n\n\n<\/body><\/html>"
</script>

          '    <label for="din-email">Email</label>',
          '    <input id="din-email" type="email" name="email" placeholder="your@email.com" required />',
          '  </div>',
          '  <button type="submit">Notify me</button>',
          '</form>',
          '<span class="din-msg" id="din-email-signup-msg"></span>',
          '<button class="din-close" id="din-email-signup-close" title="Dismiss">&#x2715;</button>',
        ].join('\n');

        document.body.appendChild(el);

        var form    = document.getElementById('din-email-signup-form');
        var msgEl   = document.getElementById('din-email-signup-msg');
        var closeEl = document.getElementById('din-email-signup-close');

        form.addEventListener('submit', async function (e) {
          e.preventDefault();
          var email = form.querySelector('[name="email"]').value.trim();
          var name  = form.querySelector('[name="name"]').value.trim();
          var btn   = form.querySelector('button[type="submit"]');

          btn.disabled    = true;
          btn.textContent = 'Submitting…';
          msgEl.textContent = '';
          msgEl.className   = 'din-msg';

          try {
            var res  = await fetch('/api/subscribe', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ email: email, name: name }),
            });
            var data = await res.json();

            if (res.ok) {
              msgEl.textContent = "You're on the list!";
              msgEl.className   = 'din-msg success';
              form.reset();
              setTimeout(function () {
                var banner = document.getElementById(FORM_ID);
                if (banner) banner.style.display = 'none';
              }, 3000);
            } else {
              msgEl.textContent = data.error || 'Something went wrong.';
              msgEl.className   = 'din-msg error';
              btn.disabled    = false;
              btn.textContent = 'Notify me';
            }
          } catch (err) {
            msgEl.textContent = 'Network error. Please try again.';
            msgEl.className   = 'din-msg error';
            btn.disabled    = false;
            btn.textContent = 'Notify me';
          }
        });

        closeEl.addEventListener('click', function () {
          var banner = document.getElementById(FORM_ID);
          if (banner) banner.style.display = 'none';
        });
      }

      // Inject immediately, then re-inject if the bundler wipes the body
      injectForm();

      var observer = new MutationObserver(function () {
        if (!document.getElementById(FORM_ID)) injectForm();
      });

      function startObserver() {
        if (document.body) {
          observer.observe(document.body, { childList: true });
        } else {
          requestAnimationFrame(startObserver);
        }
      }

      startObserver();
    })();
  </script>

</body>
</html>
